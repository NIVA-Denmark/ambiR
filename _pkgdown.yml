url: https://niva-denmark.github.io/ambiR/

development:
  mode: auto

template:
  bootstrap: 5
  math-rendering: mathjax


navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    news:
      text: News
      href: news/index.html

reference:
- subtitle: AMBI functions
  desc: >
    Core AMBI functions.
- contents:
  - AMBI
  - MAMBI

- subtitle: Benthic quality indices
  desc: >
    Other benthic quality index functions,
    including those derived from AMBI.
- contents:
  - Hdash
  - ES
  - DKI
  - DKI2
  - NSI
  - ISI
  - NQI1

- subtitle: Example data
  desc: >
    Data included with the package for testing.
- contents:
  - test_data
  - test_data_DK
  - test_data_NO


- subtitle: Utility functions
  desc: >
    Help functions for quality indices.
- contents:
  - AMBI_species
  - H_sal
  - AMBI_sal
  - NO_species

news:
  one_page: true
  releases:

articles:
- title: Background
  navbar: ~
  contents:
  - background
  - interactive
  - ambi-figures
  - other-indices

authors:
  GES4SEAS:
    href: "https://www.ges4seas.eu"
    html: "<img src='https://www.ges4seas.eu/wp-content/uploads/2022/07/Ges4Seas_logo3.png' width=140 alt='GES4SEAS logo'>"


